syntax = "proto3";

package fuzz.distributor;


import "google/v1/profile.proto";
import "types/v1/types.proto";
import "fuzz/types.proto";
import "push/v1/push.proto";

message FuzzDistributor {
  // requests
  repeated Request requests = 1;
  // mock response
  bool ingesterError = 2; //todo this should be per series-sample, not per fuzz invocation
  // mock configuration
  fuzz.Limits limits = 3;
}

message Request {
  push.v1.PushRequest request = 1;
  string tenant = 2;
}

